<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="home">
                <h3>HOME</h3>
                <p class="number-card" id="numberhome">0</p>
                
                <div class="points-container">
                    <p class="points" onclick="onepointhome()">+1</p>
                    <p class="points" onclick="twopointhome()">+2</p>
                    <p class="points" onclick="threepointhome()">+3</p>
                </div>
            </div>
            
            <div class="num-reset">
                <p class="clear" onclick="reset()"">CE</p>
            </div>
            
            <div class="guest">
                <h3>GUEST</h3>
                <p class="number-card" id="numberguest">0</p>
                
                <div class="points-container">
                    <p class="points" onclick="onepointguest()"">+1</p>
                    <p class="points" onclick="twopointguest()">+2</p>
                    <p class="points" onclick="threepointguest()">+3</p>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
